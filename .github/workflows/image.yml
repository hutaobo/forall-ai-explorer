name: Build isolated FORALL explorer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check member access fixtures
        run: |
          pip install cryptography==46.0.3
          python test_access.py
          python test_trial_access.py
      - name: Fetch and verify public workbooks
        run: |
          python - <<'PY'
          import json,hashlib,pathlib,urllib.request
          root=pathlib.Path('public-data');root.mkdir()
          for s in json.load(open('sources.json'))['datasets']:
              raw=urllib.request.urlopen(s['url'],timeout=120).read()
              assert len(raw)==s['bytes'] and hashlib.md5(raw).hexdigest()==s['md5']
              (root/s['filename']).write_bytes(raw)
          PY
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/hutaobo/forall-ai-explorer:20261022-v19
          cache-from: type=gha
          cache-to: type=gha,mode=max
